apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: aks-demo-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: aks-demo-frontend
            port:
              number: 80

      - path: /api
        pathType: Prefix
        backend:
          service:
            name: aks-demo-api
            port:
              number: 80
